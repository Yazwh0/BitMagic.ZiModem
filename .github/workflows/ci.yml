name: CI

# Builds and tests the native wrapper on both Windows and Linux, then, for tagged
# commits, packages each platform's build output and publishes them as assets on a
# GitHub Release. See docs/native-wrapper-spec.md section 10-11 for what "the build"
# actually is on each platform, and README.md for the equivalent by-hand commands this
# workflow automates.

on:
  push:
  pull_request:

permissions:
  contents: write # needed by the release job to publish a GitHub Release

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # cmake, ninja, gcc, and make all ship preinstalled on ubuntu-latest -- nothing
      # else to set up here.
      - name: Configure + build
        run: |
          cmake -S native -B build/native
          cmake --build build/native -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: zimodem-host-linux-x64-build
          path: build/native/bin/

  test-linux:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zimodem-host-linux-x64-build
          path: build/native/bin
      - name: Run native tests
        run: |
          chmod +x build/native/bin/zimodem_hal_tests build/native/bin/zimodem_core_tests build/native/bin/zimodem_host_tests
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/native/bin:$LD_LIBRARY_PATH"
          ./build/native/bin/zimodem_hal_tests
          ./build/native/bin/zimodem_core_tests
          ./build/native/bin/zimodem_host_tests

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Sets up the MSVC dev environment (vcvarsall) for the rest of this job's steps --
      # windows-latest already ships VS2022 + CMake + Ninja, so nothing else to install.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure + build
        run: |
          cmake -S native -B build/native -G Ninja
          cmake --build build/native -j
      - uses: actions/upload-artifact@v4
        with:
          name: zimodem-host-win-x64-build
          path: build/native/bin/

  test-windows:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zimodem-host-win-x64-build
          path: build/native/bin
      - name: Run native tests
        shell: pwsh
        run: |
          .\build\native\bin\zimodem_hal_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\native\bin\zimodem_core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\native\bin\zimodem_host_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zimodem-host-linux-x64-build
          path: linux-bin
      - uses: actions/download-artifact@v4
        with:
          name: zimodem-host-win-x64-build
          path: win-bin
      - name: Package archives
        run: |
          chmod +x linux-bin/zimodem_hal_tests linux-bin/zimodem_core_tests linux-bin/zimodem_host_tests
          tar -C linux-bin -czf "zimodem-host-linux-x64-${GITHUB_REF_NAME}.tar.gz" .
          (cd win-bin && zip -r "../zimodem-host-win-x64-${GITHUB_REF_NAME}.zip" .)
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "zimodem-host-linux-x64-${GITHUB_REF_NAME}.tar.gz" \
            "zimodem-host-win-x64-${GITHUB_REF_NAME}.zip" \
            --title "ZiModem host ${GITHUB_REF_NAME}" \
            --notes "Native zimodem_host builds for Windows x64 and Linux x64. See README.md for what each archive contains."
